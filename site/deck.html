<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck · AI Agents Tech Lab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main class="site-main">
    <div class="page-head"><span class="tag">Deck</span><h1>Slide specs &amp; decks</h1></div>
    <div id="app"></div>
  </main>
  <script src="/assets/app.js"></script>
  <script>
    LabSite.ready.then(async () => {
      const esc = LabSite.esc;
      const app = document.getElementById("app");
      let data;
      try { data = await LabSite.project("3-deck-pptx-creation"); }
      catch (e) { app.innerHTML = LabSite.emptyHtml("<p>Couldn't reach the local server.</p>"); return; }
      const pptx = data.outputs.filter((f) => /\.pptx$/i.test(f.name));
      const kb = (b) => `${Math.max(1, Math.round(b / 1024))} KB`;
      let html = "";
      if (pptx.length === 0 && data.json.length === 0) {
        html += LabSite.emptyHtml("<p>Nothing here yet, and that's normal.</p><p>Tell Claude Code: <strong>“quick start”</strong>. Answer three simple questions, and your PowerPoint deck will appear right here. Then refresh this page.</p>");
      }
      if (pptx.length) {
        html += `<section style="margin-bottom:2rem"><h2 style="color:var(--cap-vibrant)">Rendered files</h2>` +
          pptx.map((f) => `<div class="file-row"><a href="/projects/3-deck-pptx-creation/output/${encodeURIComponent(f.name)}" download style="color:inherit;text-decoration:none">${esc(f.name)}</a><span class="size">${kb(f.size)}</span></div>`).join("") +
          `<p class="source" style="margin-top:.5rem">A PowerPoint file can't be previewed inline: click it to download, or ask Claude Code to open it for you.</p></section>`;
      }
      for (const { name, data: deck } of data.json) {
        const slides = Array.isArray(deck.slides) ? deck.slides : [];
        html += `<section style="margin-bottom:2rem"><h2 style="color:var(--cap-vibrant)">${esc(deck.title ?? name)}</h2>` +
          (deck.subtitle ? `<p class="source">${esc(deck.subtitle)}</p>` : "") +
          `<div class="slide-list">` +
          slides.map((s, i) => `<div class="slide"><div class="stype">${esc(s.type ?? "slide")}</div><h3>${esc(s.title ?? s.text ?? `Slide ${i + 1}`)}</h3>${s.subtitle ? `<div class="source">${esc(s.subtitle)}</div>` : ""}</div>`).join("") +
          `</div></section>`;
      }
      app.innerHTML = html + LabSite.runsHtml(data.runs);
    });
  </script>
</body>
</html>
